name: Sync Release from Presto

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v1.0.0)"
        required: true

permissions: {}

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch release from Presto
        id: release
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
        run: |
          gh api repos/Presto-io/Presto/releases/tags/${{ steps.tag.outputs.tag }} \
            --jq '{name, body, prerelease, draft}' > release.json
          {
            echo "name=$(jq -r .name release.json)"
            echo "prerelease=$(jq -r .prerelease release.json)"
            echo "draft=$(jq -r .draft release.json)"
            echo "publish=$(jq -r 'if (.draft == false and .prerelease == false) then "true" else "false" end' release.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Skip non-stable release
        if: steps.release.outputs.publish != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          echo "Skipping ${TAG}: prerelease=${PRERELEASE}, draft=${DRAFT}. Homepage only publishes stable releases."

      - name: Download assets from Presto
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --repo Presto-io/Presto --dir assets

      - name: Create release in this repo
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          BODY=$(jq -r .body release.json)
          ARGS=(--title "$RELEASE_NAME" --notes "$BODY")
          if [ "$(jq -r .prerelease release.json)" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          # Delete existing release if present, then create
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "${ARGS[@]}" assets/*

      - name: Update version in source code
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Strip leading 'v' → pure version number
          VER="${TAG#v}"

          # Update shared release metadata consumed by Hero and Download.
          sed -i "s/^export const version = '.*';$/export const version = '${VER}';/" src/data/release.ts

      - name: Commit and push version bump
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/release.ts src/components/Download.astro src/components/Hero.astro
          if git diff --cached --quiet; then
            echo "No version changes"
            exit 0
          fi
          git commit -m "chore: 更新版本号至 ${TAG}"
          git push
