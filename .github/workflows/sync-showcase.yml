name: Sync Showcase

on:
  # 手动触发，避免主仓库日常提交自动刷新官网
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clean previous showcase files
        run: rm -rf public/_app public/showcase

      - name: Download showcase artifact from Presto
        uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732 # v20
        with:
          github_token: ${{ secrets.PRESTO_PAT }}
          repo: Presto-io/Presto
          workflow: build-showcase.yml
          name: showcase-static
          path: public

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/_app/ public/showcase/
          if git diff --cached --quiet; then
            echo "No changes to showcase files"
            exit 0
          fi
          git commit -m "chore: sync showcase static files from Presto"
          git push
