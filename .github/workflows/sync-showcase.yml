name: Sync Showcase

on:
  # 手动触发（保留，用于手动同步）
  workflow_dispatch:
  # 自动触发：Presto 主仓库 showcase 构建完成后上报
  repository_dispatch:
    types: [showcase-ready]

permissions: {}

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Clean previous showcase files
        run: rm -rf public/_app public/showcase

      - name: Download showcase artifact from Presto
        uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732 # v20
        with:
          github_token: ${{ secrets.PRESTO_PAT }}
          repo: Presto-io/Presto
          workflow: build-showcase.yml
          name: showcase-static
          path: public

      - name: Commit and push
        env:
          CI_GPG_KEY_ID: ${{ vars.CI_GPG_KEY_ID }}
          CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
          CI_GPG_PRIVATE_KEY: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          CI_GIT_USER_EMAIL: ${{ vars.CI_GIT_USER_EMAIL }}
          CI_GIT_USER_NAME: ${{ vars.CI_GIT_USER_NAME }}
        run: |
          git add public/_app/ public/showcase/
          if git diff --cached --quiet; then
            echo "No changes to showcase files"
            exit 0
          fi
          bash scripts/ci/setup-git-signing.sh
          git commit -m "chore: sync showcase static files from Presto"
          git push
